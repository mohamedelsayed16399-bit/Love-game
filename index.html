function makeDeck(len){
 const step=Math.round(len/5),cnt={};
 return Array.from({length:len},(_,i)=>{const ty=((i+1)%10==5)?"s":((i+1)%10==9)?"l":CYC[i%6];cnt[ty]=cnt[ty]||0;const id=cnt[ty]++%SZ[ty]();
  return ty+"|"+id+"|"+(((i+1)%step==0)?2:1)})}
const isTurn=ty=>ty=="g"||ty=="q"||ty=="d";

 s.last="يلا نبدأ! 🔥 "+s.len+" جولة قدامكم";s.deck=makeDeck(s.len);s.t=turnFor(s.deck,0)}

function myName(){const v=($("nm")&&$("nm").value.trim().slice(0,14))||ls.get("lg_name")||"";if(v)ls.set("lg_name",v);return v}
async function createRoom(){
 const nm=myName();if(!nm){joinErr="اكتب اسمك الأول";render();return}
 for(let k=0;k<6;k++){const c=newCode();
  try{const r=await runTransaction(sref(c),x=>x?undefined:fresh(nm,lenSel));
   if(r.committed){addRoom(c,nm);openRoom(c);return}}catch(e){joinErr="مش قادر أعمل غرفة: "+(e&&e.code);render();return}}
}
async function askJoin(c){
 c=(c||"").trim().toUpperCase();const nm=myName();
 if(!nm){joinErr="اكتب اسمك الأول";render();return}
 if(c.length!=5){joinErr="الكود 5 حروف";render();return}
 joinErr="";
 let res="";
 try{const g=await get(sref(c));if(!g.exists()){joinErr="مفيش غرفة بالكود ده";render();return}
  await runTransaction(sref(c),x=>{if(!x)return {tmp:1};
   const s=norm(x);
   if(s.u.indexOf(uid)>=0){res="in";return}
   if(s.u[1]){res="full";return}
   if(s.req&&s.req.u!=uid&&Date.now()-(s.req.t||0)<300000){res="busy";return}s.req={u:uid,n:nm,t:Date.now()};s.rej=null;res="asked";return s});
  }catch(e){joinErr="مشكلة اتصال: "+(e&&e.code);render();return}
 if(res=="none"){joinErr="مفيش غرفة بالكود ده";render();return}
 if(res=="busy"){joinErr="فيه طلب دخول تاني قيد الانتظار عند صاحب الغرفة، جرب كمان شوية";render();return}
  if(res=="full"){joinErr="الغرفة دي فيها لاعبين بالفعل";render();return}
 addRoom(c,"");openRoom(c)}
function openRoom(c){
 closeRoom(true);lastUnread=-1;code=c;pq=0;pa=[];mrk=-1;msgs=[];st=null;ls.set("lg_last",c);
 history.replaceState(null,"","?r="+c);
 stFirst=true;needPrev=null;startPresence(c);startFx(c);

const T_LOVE=["الكلام الحلو والاعتراف بالمشاعر بيفرّحوه 💌","بيعبّر بالهدايا والتفاصيل الصغيرة 🎁","القرب والحضن بيطمّنوه 🤗","أغلى حاجة عنده الوقت والاهتمام ⏳"];

const T_FLAW=["دماغ ناشفة بس ثابت على اللي بيحبه","الغيرة دليل تعلق، ومحتاجة طمأنة","التأجيل بيتحل بمواعيد واضحة","الرغي بيدفّي أي قعدة"];

function pct(a,b){return b?Math.round(a/b*100):0}
function analysis(s,k){
 const out=[];const pr=s.prof[k];
 const core=key=>{const p=s.pi.indexOf(CORE[key]);if(!pr||p<0||pr[p]==null)return null;return {i:pr[p],t:GQ[CORE[key]].o[pr[p]]}};
 const o=core("out");
 out.push(["الشخصية",o?T_OUT[o.i][0]+" -- "+T_OUT[o.i][1]:"شخصية مميزة 💫"]);
 let x=core("love");if(x)out.push(["لغة الحب",x.t+" -- "+T_LOVE[x.i]]);
 x=core("upset");if(x)out.push(["عند الزعل",T_UPSET[x.i]]);
 x=core("flaw");if(x)out.push(["العيب المعترف بيه",x.t+" -- "+T_FLAW[x.i]]);
 x=core("fear");if(x)out.push(["أكتر حاجة بتخوّف",x.t]);
 x=core("attr");if(x)out.push(["اللي بيشتريه في الناس",x.t]);
 x=core("power");if(x)out.push(["سوبر باور الأحلام",x.t]);
 const knows=pct(s.ok[k],s.tot[k]),known=pct(s.ac[k],s.ak[k]);
 out.push(["فهمه لحبيبه",s.tot[k]?knows+"% من توقعاته صح":"لسه مفيش توقعات"]);
 out.push(["فهم حبيبه له",s.ak[1-k]?pct(s.ac[1-k],s.ak[1-k])+"% (من أسئلة التخمين عليه)":"لسه"]);
 const av=s.cn[k]?Math.round(s.cw[k]/s.cn[k]):0;
 out.push(["أسلوب الكلام",!s.cn[k]?"ماجاوبش على أسئلة مفتوحة":av<20?"مختصر وعملي ✂️":av<60?"متوازن في التعبير ⚖️":"كاتب مشاعر 📝"]);
 out.push(["التحديات",s.dt[k]?s.dc[k]+" من "+s.dt[k]+" اتنفذت"+(s.dc[k]==s.dt[k]?" 💪":""):"مفيش تحديات"]);
 // نقطة القوة
 let strong;const romantic=s.ti[k].some(t=>/رومانسي|الكلام الحلو|قلب حنين|حبيب مطمن/.test(t));
 if(romantic)strong="قلب كبير: الاتنين شايفينه رومانسي وحنين 🌹";
 else if(knows>=60)strong="فاهم حبيبه بعمق 🔮";
 else if(s.dt[k]&&s.dc[k]==s.dt[k])strong="جريء ومابيهربش من أي تحدي 🔥";
 else if(s.sk[k]>=3||s.bs[k]>=3)strong="تركيزه عالي وبيمسك سلسلة صح 🎯";
 else strong="بيكمّل حبيبه ويحسن الصحبة 💞";
 out.push(["نقطة القوة",strong]);
 if(s.ti[k].length)out.push(["الألقاب",s.ti[k].join(" • ")]);
 return out}
function verdict(s){
 const a=s.S[0],b=s.S[1],gap=Math.abs(a-b),w=a>b?0:1,l=1-w;
 const tot=s.tot[0]+s.tot[1],comp=tot?Math.round((s.ok[0]+s.ok[1])/tot*100):0;
 let hd,body;
 if(gap==0){hd="🤝 تعادل! الحب كسب";body="مفيش غالب ولا مغلوب… الاتنين متساويين في الحب والعند 😂"}
 else if(gap<=100){hd="🏆 الفايز: "+s.n[w];body="فوز بالعافية! "+s.n[l]+" كان قريب أوي 😏"}
 else if(gap<=300){hd="👑 الفايز: "+s.n[w];body=s.n[w]+" حافظ حبيبه كويس. و"+s.n[l]+" عليه يذاكر أكتر 📚"}
 else{hd="👑🔥 فوز ساحق لـ "+s.n[w];body=s.n[l]+" هيدفع العشا النهارده 😂🍽️"}
 let cm;
 if(comp>=75)cm="💞 توأم روح! بتفهموا بعض من غير كلام";
 else if(comp>=50)cm="✨ كيميا حلوة، شوية تركيز كمان وتبقوا مثال";
 else if(comp>=25)cm="🌱 لسه بتتعرفوا على بعض… كمّلوا وهتطلعوا حلوين";
 else cm="😂 محتاجين قعدة صفا وتتكلموا أكتر!";
 return {hd,body,comp,cm}}

  }

/* ====== الدردشة (خاصة بالغرفة) ====== */
const seenKey=()=>"lg_seen_"+code;
function setChat(o){chatOpen=o;$("sheet").style.display=o?"flex":"none";if(o){ls.set(seenKey(),String(Date.now()));drawChat();setTimeout(()=>$("ci").focus(),50)}}
function drawChat(){
 if(!code)return;const box=$("chat");const seen=+ls.get(seenKey())||0;let unread=0;
 if(chatOpen){box.innerHTML="";
  if(!msgs.length){const e=document.createElement("p");e.textContent="مفيش رسائل لسه. ابدأ إنت 💬";box.appendChild(e)}
  msgs.forEach(x=>{const el=document.createElement("div");el.className="m "+(x.u==uid?"me":"ot");const sm=document.createElement("small");const d=new Date(x.t||0);sm.textContent=x.n+" • "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});el.appendChild(sm);el.appendChild(document.createTextNode(x.m));box.appendChild(el)});
  box.scrollTop=box.scrollHeight;ls.set(seenKey(),String(Date.now()))}
 else{msgs.forEach(x=>{if(x.u!=uid&&(x.t||0)>seen)unread++});if(lastUnread>=0&&unread>lastUnread)ping();lastUnread=unread}

["❤️","😂","😍","🥺","👏","🔥"].forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>send(e);$("qk").appendChild(b)});

const BASE_TITLE=document.title;
let stFirst=true,needPrev=null,pres={},unsubP=null,unsubCon=null,unsubF=null,fxFirst=true,lastFxT=0,prevLast=null,prevPh=null,ac=null;

function sendFx(e){if(me()<0||!code||Date.now()-lastFxT<700)return;lastFxT=Date.now();floatEmoji(e);push(ref(rdb,BASE+code+"/fx"),{u:uid,e,t:Date.now()}).catch(()=>{})}
function floatEmoji(e){const el=document.createElement("div");el.className="fl";el.textContent=e;el.style.left=(10+Math.random()*75)+"%";document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function confetti(n){const E=["💖","✨","🎉","💞","🌟","💗"];for(let k=0;k<(n||26);k++){const el=document.createElement("div");el.className="cf";el.textContent=E[k%E.length];el.style.left=Math.random()*100+"%";el.style.fontSize=(16+Math.random()*18)+"px";el.style.animationDuration=(1.6+Math.random()*1.8)+"s";el.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}}
const snd=()=>ls.get("lg_snd")!=="0";
function ping(){try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}if(!snd())return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="sine";o.frequency.setValueAtTime(880,ac.currentTime);o.frequency.setValueAtTime(1320,ac.currentTime+.12);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.start();o.stop(ac.currentTime+.36)}catch(e){}}
function needsMe(s,i){if(i<0)return false;
 if(s.ph=="lobby")return i==0&&!!s.req;
 if(s.ph=="prof")return !s.prof[i];
 if(s.ph!="play")return false;
 const c=cur(s);
 if(c.ty=="g")return s.t==i;

 if(c.ty=="l"){const both=s.v[0]!==null&&s.v[1]!==null;return both?s.rv[i]===null:s.v[i]===null}
 return s.v[i]===null}

 const nd=needsMe(s,i);

 else if(s.last&&s.last!==prevLast&&/^✅|قرّوا بعض|اتفقتوا|تطابق تام|برافو/.test(s.last))confetti(22);
 prevLast=s.last;prevPh=s.ph}

 g.fillStyle="rgba(255,255,255,.3)";g.fillRect(190,y+330,700,26);g.fillStyle="#fff";g.fillRect(190,y+330,7*v.comp,26);
 g.font="700 44px "+F;y=wrapT(g,v.cm,W/2,y+440,860,64);
 g.font="800 58px "+F;g.fillText(s.n[0]+"  "+s.S[0]+"  ×  "+s.S[1]+"  "+s.n[1],W/2,y+80);
 g.font="600 40px "+F;let yy=y+150;[0,1].forEach(k=>{if(s.ti[k].length){yy=wrapT(g,s.n[k]+": "+s.ti[k].slice(0,2).join(" • "),W/2,yy,860,56)}});
