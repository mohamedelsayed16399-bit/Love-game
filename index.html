 "إيه أكتر حاجة بتخليك تشتاق لـ {o}؟ 🥺",
 "لو {o} يبقى لون، هيبقى إيه؟ 🎨",
 "إيه الحاجة اللي بتخاف تخسرها في {o}؟ 💔",
 "لو تكتب أغنية لـ {o}، عن إيه هتكون؟ 🎤",
 "إيه أكتر حاجة بتحبها في شخصية {o}؟ 🌹",
 "إيه أحلى مجاملة سمعتها من {o}؟ 💬",
 "لو {o} يبقى فيلم، هيبقى نوعه إيه؟ 🎬",
 "إيه أكتر حاجة نفسك تقولها لـ {o} ومش لاقي وقت؟ 🗣️",
 "إيه أحلى لحظة جمعتكم لحد دلوقتي؟ 💞",
 "إيه الحاجة اللي نفسك تعملوها سوا السنة دي؟ ✨",
 "لو سافرتوا بكرة، رايحين فين؟ ✈️",
 "إيه الكلمة اللي نفسك تسمعها منه أكتر؟ 💬"
];

/* ================= حالة اللعبة ================= */
let uid=null,st=null,pq=0,pa=[],mo=null,mrk=-1;

// 100 جولة موزعة
const PAT=[
"g","m","d","g","v","q","g","m","d","q",
"v","q","g","m","d","g","v","g","m","r",
"g","d","v","q","g","m","d","g","v","q",
"g","m","r","g","d","v","q","q","m","d",
"g","v","r","q","g","m","d","r","g","v",
"g","m","d","g","v","q","g","m","d","q",
"v","q","g","m","d","g","v","g","m","r",
"g","d","v","q","g","m","d","g","v","q",
"g","m","r","g","d","v","q","q","m","d",
"g","v","r","q","g","m","d","r","g","v"
];
// الجولات الدبل: 20, 40, 60, 80, 100 (الجولة الذهبية)
const MULT={19:2, 39:2, 59:2, 79:2, 99:2}; 
const MAX=PAT.length;
const L=x=>x?Object.keys(x).map(k=>x[k]):[];
const pair=(x,d)=>{x=x||[];return [x[0]==null?d:x[0],x[1]==null?d:x[1]]};
const shuf=n=>{const a=[...Array(n).keys()];for(let m=a.length-1;m>0;m--){const x=Math.floor(Math.random()*(m+1));[a[m],a[x]]=[a[x],a[m]]}return a};
function makeDeck(){
 const sz={g:P.length,m:H.length,d:D.length,v:W.length,q:Q.length,r:R.length},pool={};
 for(const k in sz)pool[k]=shuf(sz[k]);
 return PAT.map((ty,i)=>ty+"|"+pool[ty].pop()+"|"+(MULT[i]||1));
}
const isTurn=ty=>ty=="g"||ty=="q"||ty=="d";
function turnFor(deck,r){let n=0;for(let j=0;j<r;j++)if(isTurn(deck[j].split("|")[0]))n++;return n%2}
function fresh(){return {n:["",""],u:["",""],ph:"lobby",prof:[null,null],t:0,r:0,S:[0,0],ok:[0,0],tot:[0,0],sk:[0,0],bs:[0,0],ti:[[],[]],v:[null,null],a:"",last:"",deck:[]}}
function norm(s){
 s.n=pair(s.n,"");s.u=pair(s.u,"");s.S=pair(s.S,0);s.ok=pair(s.ok,0);s.tot=pair(s.tot,0);s.sk=pair(s.sk,0);s.bs=pair(s.bs,0);
 s.prof=pair(s.prof,null).map(p=>p?L(p):null);
 s.ti=pair(s.ti,null).map(L);
 s.v=pair(s.v,null).map(e=>e!==null&&typeof e=="object"?L(e):e);
 s.deck=L(s.deck);s.a=s.a||"";s.last=s.last||"";s.t=s.t||0;s.r=s.r||0;s.ph=s.ph||"lobby";
 return s}
function startPlay(s){s.ph="play";s.r=0;s.S=[0,0];s.ok=[0,0];s.tot=[0,0];s.sk=[0,0];s.bs=[0,0];s.ti=[[],[]];s.v=[null,null];s.a="";s.last="يلا نبدأ! 🔥 100 جولة قدامنا";s.deck=makeDeck();s.t=turnFor(s.deck,0)}
function adv(s,msg){s.last=msg;s.v=[null,null];s.a="";s.r++;if(s.r>=MAX)s.ph="end";else s.t=turnFor(s.deck,s.r)}
function cur(s){const p=s.deck[s.r].split("|");return {ty:p[0],id:+p[1],mx:+p[2]}}
function me(){return st?st.u.indexOf(uid):-1}

function act(fn){runTransaction(sref,c=>{const s=c?norm(c):fresh();return fn(s)===false?undefined:s}).catch(e=>{$("main").insertAdjacentHTML("afterbegin","<p style='color:var(--accent)'>مش قادر أحفظ: "+(e&&e.code)+" (راجع قواعد Firebase)</p>")})}
const inRound=(s,r)=>s.ph=="play"&&s.r==r;

function join(){
 const nm=$("nm").value.trim().slice(0,14)||"لاعب";
 act(s=>{if(s.u.indexOf(uid)>=0)return false;
  if(!s.u[0]){s.n[0]=nm;s.u[0]=uid;s.ph="lobby"}
  else if(!s.u[1]){s.n[1]=nm;s.u[1]=uid;s.ph="prof"}
  else return false})
}
function resetAll(){pq=0;pa=[];act(s=>{Object.assign(s,fresh());return true})}
function replay(){act(s=>{if(s.ph!="end")return false;startPlay(s)})}

function mk(p,txt,cls,fn,dis){const b=document.createElement("button");b.className="b "+(cls||"");b.textContent=txt;b.disabled=!!dis;b.onclick=fn;p.appendChild(b);return b}
function tp(p,txt){const e=document.createElement("p");e.textContent=txt;p.appendChild(e);return e}
function dv(p,cls,txt){const e=document.createElement("div");if(cls)e.className=cls;if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function bar(p,pc){const b=dv(p,"bar"),i=document.createElement("i");i.style.width=pc+"%";b.appendChild(i)}

function titlesOf(s,k){
 const out=[],acc=s.tot[k]?s.ok[k]/s.tot[k]:0;
 if(s.tot[k]){
  if(acc>=.75)out.push("🔮 قارئ الأفكار");
  else if(acc>=.5)out.push("🕵️ المحقق الشاطر");
  else if(acc>=.25)out.push("🤔 لسه بيتعرّف");
  else out.push("😅 مش واخد باله من حبيبه");
 }
 if(s.bs[k]>=3)out.push("🔥 صاحب السلسلة ×"+s.bs[k]);
 s.ti[k].forEach(t=>out.push(t));
 return out}

function verdict(s){
 const a=s.S[0],b=s.S[1],gap=Math.abs(a-b),w=a>b?0:1,l=1-w;
 const tot=s.tot[0]+s.tot[1],comp=tot?Math.round((s.ok[0]+s.ok[1])/tot*100):0;
 let head,body;
 if(gap==0){head="🤝 تعادل! الحب كسب";body="مفيش غالب ولا مغلوب… الاتنين متساويين في الحب والعند 😂"}
 else if(gap<=100){head="🏆 الفايز: "+s.n[w];body="فوز بالعافية! "+s.n[l]+" كان قريب أوي، الجولة الجاية الدنيا هتتقلب 😏"}
 else if(gap<=300){head="👑 الفايز: "+s.n[w];body=s.n[w]+" حافظ حبيبه كويس. و"+s.n[l]+" عليه يذاكر أكتر 📚"}
 else{head="👑🔥 فوز ساحق لـ "+s.n[w];body=s.n[l]+" هيدفع العشا النهارده، والحكم نهائي ومفيهوش استئناف 😂🍽️"}
 let cm;
 if(comp>=75)cm="💞 توأم روح! بتفهموا بعض من غير كلام";
 else if(comp>=50)cm="✨ كيميا حلوة، شوية تركيز كمان وتبقوا مثال يحتذى بيه";
 else if(comp>=25)cm="🌱 لسه بتتعرفوا على بعض… كمّلوا وهتطلعوا حلوين";
 else cm="😂 محتاجين قعدة صفا وتتكلموا أكتر!";
 return {head,body,comp,cm}}

function render(){
 const m=$("main");m.innerHTML="";const s=st,i=me();
 dv(m,"","").appendChild(Object.assign(document.createElement("h1"),{textContent:"لعبة الحب أونلاين 💞"}));
 if(!s||(s.ph=="lobby"&&i<0)){
  tp(m,!s||!s.u[0]?"اكتب اسمك وادخل، وابعت الرابط للتاني يدخل كمان 💌":(s.n[0]+" منتظرك! ادخل واكتب اسمك"));
  const inp=document.createElement("input");inp.id="nm";inp.placeholder="اسمك";m.appendChild(inp);mk(m,"ادخل اللعبة 🎮","",join);return}
 if(s.ph=="lobby"){tp(m,"⏳ منتظرين اللاعب التاني يفتح الرابط ويدخل…");mk(m,"إلغاء","alt",resetAll);return}
 if(i<0){tp(m,"اللعبة دي فيها لاعبين بالفعل ("+s.n[0]+" و"+s.n[1]+")");mk(m,"ابدأ لعبة جديدة","",resetAll);return}
 const other=s.n[1-i];

 if(s.ph=="prof"){
  if(s.prof[i]){
   dv(m,"big","⏳");
   tp(m,"تمام يا "+s.n[i]+"! إجاباتك اتسجلت ✅ -- منتظرين "+other+" يخلص أسئلته…");
   return}
  tp(m,"الأول: جاوب عن نفسك بصراحة 😏 "+other+" هيحاول يخمّن إجاباتك بعد كده!");
  bar(m,Math.round(pq/P.length*100));
  const q=P[pq];
  dv(m,"","").textContent="سؤال "+(pq+1)+" من "+P.length;
  dv(m,"").id="txt";m.lastChild.textContent=q.s;
  const bt=dv(m,"row");
  q.o.forEach((o,k)=>mk(bt,o,k%2?"alt":"",()=>{
   pa.push(k);pq++;
   if(pq>=P.length){const mine=pa.slice();act(x=>{x.prof[i]=mine;if(x.prof[0]&&x.prof[1])startPlay(x)});pa=[];pq=0}
   else render();
  }));
  return}

 const sc=dv(m,"sc");
 [0,1].forEach(k=>{const d=dv(sc,"");
  if(s.ph=="play"){const c=cur(s);if(isTurn(c.ty)&&k==s.t)d.className="on"}
  d.textContent=s.n[k]+(k==i?" (أنت)":"");
  const b=document.createElement("b");b.textContent=s.S[k];d.appendChild(b);
  const sm=document.createElement("small");sm.textContent=s.sk[k]>=2?"🔥 سلسلة "+s.sk[k]:"";d.appendChild(sm)});
 const l=dv(m,"","");l.id="last";l.textContent=s.last;

 if(s.ph=="end"){
  const v=verdict(s);
  dv(m,"big",s.S[0]==s.S[1]?"🤝":"🏆");
  const h=document.createElement("h2");h.textContent=v.head;m.appendChild(h);
  tp(m,v.body);
  [0,1].forEach(k=>{const pl=dv(m,"pl");const bb=document.createElement("b");bb.textContent=s.n[k]+" -- "+s.S[k]+" نقطة";pl.appendChild(bb);
   const sm=dv(pl,"","");sm.style.color="var(--muted)";sm.style.fontSize="13px";sm.textContent="خمّن صح "+s.ok[k]+" من "+s.tot[k];
   const tt=dv(pl,"","");titlesOf(s,k).forEach(t=>{const e=document.createElement("span");e.className="ti";e.textContent=t;tt.appendChild(e)})});
  const cp=dv(m,"pl","");const c1=document.createElement("b");c1.textContent="نسبة التفاهم: "+v.comp+"%";cp.appendChild(c1);bar(cp,v.comp);dv(cp,"",v.cm);
  const bt=dv(m,"row");
  mk(bt,"🔁 نفس الإجابات، 100 جولة جديدة","",replay);
  mk(bt,"🆕 نبدأ من الأول","alt",resetAll);
  return}

 const r=s.r,c=cur(s),mine=s.t==i,who=s.n[s.t];
 if(mrk!=r){mrk=r;mo=null}
 const meta=dv(m,"","");
 const t1=document.createElement("small");t1.style.color="var(--muted)";t1.textContent="الجولة "+(r+1)+" من "+MAX+" ";meta.appendChild(t1);
 if(c.mx>1){const g=document.createElement("span");g.className="tag";g.textContent=r==MAX-1?"👑 الجولة الذهبية ×2":"⚡ جولة دبل ×2";meta.appendChild(g)}
 const pts=10*c.mx;
 const kd=dv(m,"","");kd.id="kind";
 const bt=document.createElement("div");bt.className="row";
 const body=ty=>{const e=dv(m,"","");e.id="txt";return e};

 if(c.ty=="g"){
  const asked=1-s.t,q=P[c.id],txt=q.g.replace(/\{o\}/g,s.n[asked]);
  kd.textContent="🕵️ خمّن -- "+who+" بيخمّن إجابة "+s.n[asked]+" (+"+pts+")";
  body().textContent=txt;m.appendChild(bt);
  if(mine){
   tp(bt,"اختار اللي تتوقعه 👇");
   q.o.forEach((o,k)=>mk(bt,o,k%2?"alt":"",()=>{act(x=>{if(!inRound(x,r)||x.t!=i)return false;
     const real=x.prof[1-i][c.id],ok=k==real;x.tot[i]++;
     if(ok){x.ok[i]++;x.sk[i]++;if(x.sk[i]>x.bs[i])x.bs[i]=x.sk[i];const bonus=Math.min(15,5*(x.sk[i]-1));x.S[i]+=pts+bonus;
      adv(x,"✅ "+x.n[i]+" عرف! الإجابة "+q.o[real]+" -- +"+(pts+bonus)+(bonus?" (بونص سلسلة 🔥)":""))}
     else{x.sk[i]=0;adv(x,"❌ "+x.n[i]+" قال "+q.o[k]+" بس "+x.n[1-i]+" اختار "+q.o[real]+" 😅")}})}));
  }else{
   tp(bt,"⏳ "+who+" بيخمّن إجابتك على: «"+q.s+"» -- ادعي له 😂");
  }
 }
 else if(c.ty=="m"){
  const h=H[c.id];
  kd.textContent="🔮 قارئ الأفكار -- الاتنين يختاروا ويتوقعوا (+"+pts+" لكل توقع صح)";
  const done=s.v[i]!==null;
  if(done){body().textContent=h[0]+"  أو  "+h[1];m.appendChild(bt);tp(bt,"✅ سجلت اختيارك: "+h[s.v[i][0]]+" وتوقعك: "+h[s.v[i][1]]+" -- ⏳ منتظر "+other)}
  else if(mo===null){body().textContent="إنت شخصياً بتفضل إيه؟";m.appendChild(bt);h.forEach((o,k)=>mk(bt,o,k?"alt":"",()=>{mo=k;render()}))}
  else{body().textContent="طب "+other+" هيختار إيه؟ 🤔";m.appendChild(bt);h.forEach((o,k)=>mk(bt,o,k?"alt":"",()=>{const own=mo;
    act(x=>{if(!inRound(x,r)||x.v[i]!==null)return false;x.v[i]=[own,k];
     if(x.v[0]!==null&&x.v[1]!==null){
      const res=[0,1].map(z=>x.v[z][1]==x.v[1-z][0]);
      [0,1].forEach(z=>{x.tot[z]++;if(res[z]){x.ok[z]++;x.S[z]+=pts;x.sk[z]++;if(x.sk[z]>x.bs[z])x.bs[z]=x.sk[z]}else x.sk[z]=0});
      const msg=x.n[0]+" اختار "+h[x.v[0][0]]+" و"+x.n[1]+" اختار "+h[x.v[1][0]]+" -- "+(res[0]&&res[1]?"الاتنين قرّوا بعض! 💞":res[0]?x.n[0]+" عرف بس "+x.n[1]+" لأ 😄":res[1]?x.n[1]+" عرف بس "+x.n[0]+" لأ 😄":"محدش عرف التاني! 😂");
      adv(x,msg)}})}))}
 }
 else if(c.ty=="v"){
  const w=W[c.id];kd.textContent="👆 تصويت -- لو اتفقتوا: +5 للاتنين واللقب لـ اللي اتصوّت له";
  body().textContent=w[0];m.appendChild(bt);
  if(s.v[i]!==null){tp(bt,"✅ اخترت: "+s.n[s.v[i]]+" -- ⏳ منتظر "+other)}
  else{tp(bt,"اختار/ي واحد 👇");[0,1].forEach(k=>mk(bt,s.n[k],k?"alt":"",()=>{act(x=>{if(!inRound(x,r)||x.v[i]!==null)return false;x.v[i]=k;
    if(x.v[0]!==null&&x.v[1]!==null){
     if(x.v[0]==x.v[1]){const z=x.v[0];x.S[0]+=5;x.S[1]+=5;x.ti[z].push(w[1]);adv(x,"اتفقتوا! 🎖️ "+x.n[z]+" خد لقب: "+w[1]+" (+5 للاتنين)")}
     else adv(x,x.n[0]+" صوّت لـ "+x.n[x.v[0]]+" و"+x.n[1]+" صوّت لـ "+x.n[x.v[1]]+" -- اختلفتوا 😄")}})}))}
 }
 else if(c.ty=="r"){
  kd.textContent="💬 سؤال رومانسي -- الاتنين يجاوبوا (+5 لكل واحد)";
  body().textContent=R[c.id];m.appendChild(bt);
  if(s.v[i]===null){tp(bt,"اتكلموا في الدردشة أو بصوتكم، وبعدين دوس 👇");mk(bt,"جاوبت ✔","",()=>{act(x=>{if(!inRound(x,r)||x.v[i]!==null)return false;x.v[i]=1;
    if(x.v[0]!==null&&x.v[1]!==null){x.S[0]+=5;x.S[1]+=5;adv(x,"حلوين أوي 🥰 +5 للاتنين")}})})}
  else tp(bt,"✅ جاوبت -- ⏳ منتظر "+other);
 }
 else{
  const isQ=c.ty=="q",tx=(isQ?Q:D)[c.id].replace(/\{o\}/g,s.n[1-s.t]);
  kd.textContent=(isQ?"🧠 سؤال -- ":"🔥 تحدي -- ")+who+(isQ?" يجاوب":" ينفّذ")+" (+"+pts+")";
  body().textContent=tx;m.appendChild(bt);
  if(mine){
   if(!s.a){
    if(isQ){tp(bt,"اكتب إجابتك 👇");const ai=document.createElement("input");ai.id="ans";ai.placeholder="إجابتك…";bt.appendChild(ai);
     mk(bt,"إرسال الإجابة 📨","",()=>{const v=$("ans").value.trim();if(!v)return;act(x=>{if(!inRound(x,r)||x.a)return false;x.a=v.slice(0,200)})})}
    else{tp(bt,"نفّذ التحدي وبعدين دوس 👇");mk(bt,"خلصت التحدي ✔","",()=>act(x=>{if(!inRound(x,r)||x.a)return false;x.a="تم"}))}
   }else tp(bt,"✅ تم -- ⏳ منتظر حكم "+other);
  }else{
   if(!s.a)tp(bt,"⏳ منتظر "+who+(isQ?" يجاوب…":" ينفّذ التحدي…"));
   else{
    const ab=dv(bt,"ansbox",isQ?"إجابة "+who+": "+s.a:who+" بيقول إنه نفّذ التحدي ✔");
    mk(bt,isQ?"❤️ عجبتني (+"+pts+" لـ "+who+")":"✔ نفّذ (+"+pts+" لـ "+who+")","",()=>act(x=>{if(!inRound(x,r))return false;x.S[x.t]+=pts;adv(x,"برافو لـ "+who+"! 👏 +"+pts)}));
    mk(bt,isQ?"😅 ضعيفة":"✖ لأ","alt",()=>act(x=>{if(!inRound(x,r))return false;adv(x,isQ?"حكم "+x.n[1-x.t]+": إجابة ضعيفة 😅":"يا خسارة، التحدي مأخدش 😅")}));
   }
  }
 }
}

function send(){const v=$("ci").value.trim();if(!v||me()<0)return;$("ci").value="";push(cref,{u:uid,n:st.n[me()],m:v.slice(0,300),t:Date.now()}).catch(()=>{})}
function chat(){onValue(query(cref,limitToLast(60)),q=>{const box=$("chat");box.innerHTML="";q.forEach(d=>{const x=d.val(),el=document.createElement("div");el.className="m "+(x.u==uid?"me":"ot");const sm=document.createElement("small");sm.textContent=x.n;el.appendChild(sm);el.appendChild(document.createTextNode(x.m));box.appendChild(el)});box.scrollTop=box.scrollHeight})}
try{uid=localStorage.getItem("lg_uid");if(!uid){uid="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("lg_uid",uid)}}catch(e){uid="u"+Math.random().toString(36).slice(2)}
$("cbox").style.display="flex";$("cs").onclick=send;$("ci").onkeydown=e=>{if(e.key=="Enter")send()};
onValue(sref,sn=>{const v=sn.val();st=v?norm(v):null;render()},e=>{$("main").innerHTML="<p>مشكلة في الاتصال: "+e.code+"</p>"});
chat();
</script>
</body>
</html>
