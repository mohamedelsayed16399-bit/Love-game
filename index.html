function norm(s){
 s.n=pair(s.n,"");s.u=pair(s.u,"");s.S=pair(s.S,0);s.ok=pair(s.ok,0);s.tot=pair(s.tot,0);s.sk=pair(s.sk,0);s.bs=pair(s.bs,0);

 s.deck=L(s.deck);s.pi=L(s.pi);s.fav=L(s.fav);s.a=s.a||"";s.last=s.last||"";s.t=s.t||0;s.r=s.r||0;s.ph=s.ph||"lobby";s.len=s.len||60;s.req=s.req||null;

const SZ={g:()=>PROF_N,q:()=>OQ.length,d:()=>DQ.length,v:()=>VQ.length,m:()=>MQ.length,r:()=>RQ.length,s:()=>SYNQ.length,l:()=>LQ.length};
function makeDeck(len){
 const step=Math.round(len/5),cnt={},pm={};
 return Array.from({length:len},(_,i)=>{const ty=((i+1)%10==5)?"s":((i+1)%10==9)?"l":CYC[i%6];cnt[ty]=cnt[ty]||0;const sz=SZ[ty]();if(!pm[ty]||cnt[ty]%sz==0)pm[ty]=shuf(Array.from({length:sz},(_,k)=>k));const id=pm[ty][cnt[ty]++%sz];
  return ty+"|"+id+"|"+(((i+1)%step==0)?2:1)})}
const isTurn=ty=>ty=="g"||ty=="q"||ty=="d";
function turnFor(deck,r){let n=0;for(let j=0;j<r;j++)if(isTurn(deck[j].split("|")[0]))n++;return n%2}

 for(let k=0;k<6;k++){const c=newCode();
  try{const r=await runTransaction(sref(c),x=>x?undefined:fresh(nm,lenSel));
   if(r.committed){addRoom(c,nm);openRoom(c);return}}catch(e){joinErr="مش قادر أعمل غرفة: "+(e&&e.code);render();return}}
}

   if(s.u.indexOf(uid)>=0){res="in";return}

  if(res=="full"){joinErr="الغرفة دي فيها لاعبين بالفعل";render();return}
 addRoom(c,"");openRoom(c)}

function pct(a,b){return b?Math.round(a/b*100):0}
function analysis(s,k){
 const out=[];const pr=s.prof[k];
 const core=key=>{const p=s.pi.indexOf(CORE[key]);if(!pr||p<0||pr[p]==null)return null;return {i:pr[p],t:GQ[CORE[key]].o[pr[p]]}};
 const o=core("out");
 out.push(["الشخصية",o?T_OUT[o.i][0]+" -- "+T_OUT[o.i][1]:"شخصية مميزة 💫"]);
 let x=core("love");if(x)out.push(["لغة الحب",x.t+" -- "+T_LOVE[x.i]]);
 x=core("upset");if(x)out.push(["عند الزعل",T_UPSET[x.i]]);
 x=core("flaw");if(x)out.push(["العيب المعترف بيه",x.t+" -- "+T_FLAW[x.i]]);
 x=core("fear");if(x)out.push(["أكتر حاجة بتخوّف",x.t]);
 x=core("attr");if(x)out.push(["اللي بيشتريه في الناس",x.t]);
 x=core("power");if(x)out.push(["سوبر باور الأحلام",x.t]);
 const knows=pct(s.ok[k],s.tot[k]),known=pct(s.ac[k],s.ak[k]);
 out.push(["فهمه لحبيبه",s.tot[k]?knows+"% من توقعاته صح":"لسه مفيش توقعات"]);
 out.push(["فهم حبيبه له",s.ak[1-k]?pct(s.ac[1-k],s.ak[1-k])+"% (من أسئلة التخمين عليه)":"لسه"]);
 const av=s.cn[k]?Math.round(s.cw[k]/s.cn[k]):0;
 out.push(["أسلوب الكلام",!s.cn[k]?"ماجاوبش على أسئلة مفتوحة":av<20?"مختصر وعملي ✂️":av<60?"متوازن في التعبير ⚖️":"كاتب مشاعر 📝"]);
 out.push(["التحديات",s.dt[k]?s.dc[k]+" من "+s.dt[k]+" اتنفذت"+(s.dc[k]==s.dt[k]?" 💪":""):"مفيش تحديات"]);
 // نقطة القوة
 let strong;const romantic=s.ti[k].some(t=>/رومانسي|الكلام الحلو|قلب حنين|حبيب مطمن/.test(t));
 if(romantic)strong="قلب كبير: الاتنين شايفينه رومانسي وحنين 🌹";
 else if(knows>=60)strong="فاهم حبيبه بعمق 🔮";
 else if(s.dt[k]&&s.dc[k]==s.dt[k])strong="جريء ومابيهربش من أي تحدي 🔥";
 else if(s.sk[k]>=3||s.bs[k]>=3)strong="تركيزه عالي وبيمسك سلسلة صح 🎯";
 else strong="بيكمّل حبيبه ويحسن الصحبة 💞";
 out.push(["نقطة القوة",strong]);
 if(s.ti[k].length)out.push(["الألقاب",s.ti[k].join(" • ")]);
 return out}
function verdict(s){
 const a=s.S[0],b=s.S[1],gap=Math.abs(a-b),w=a>b?0:1,l=1-w;
 const tot=s.tot[0]+s.tot[1],comp=tot?Math.round((s.ok[0]+s.ok[1])/tot*100):0;
 let hd,body;
 if(gap==0){hd="🤝 تعادل! الحب كسب";body="مفيش غالب ولا مغلوب… الاتنين متساويين في الحب والعند 😂"}
 else if(gap<=100){hd="🏆 الفايز: "+s.n[w];body="فوز بالعافية! "+s.n[l]+" كان قريب أوي 😏"}
 else if(gap<=300){hd="👑 الفايز: "+s.n[w];body=s.n[w]+" حافظ حبيبه كويس. و"+s.n[l]+" عليه يذاكر أكتر 📚"}
 else{hd="👑🔥 فوز ساحق لـ "+s.n[w];body=s.n[l]+" هيدفع العشا النهارده 😂🍽️"}
 let cm;
 if(comp>=75)cm="💞 توأم روح! بتفهموا بعض من غير كلام";
 else if(comp>=50)cm="✨ كيميا حلوة، شوية تركيز كمان وتبقوا مثال";
 else if(comp>=25)cm="🌱 لسه بتتعرفوا على بعض… كمّلوا وهتطلعوا حلوين";
 else cm="😂 محتاجين قعدة صفا وتتكلموا أكتر!";
 return {hd,body,comp,cm}}
